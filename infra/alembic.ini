# Alembic connects as aria_migrate, which owns the tables. The application role
# (aria_app) cannot run migrations and cannot alter tables.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# The URL comes from ARIA_MIGRATE_DATABASE_URL via env.py, never from this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
