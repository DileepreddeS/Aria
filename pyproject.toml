[project]
name = "aria"
version = "0.0.0"
description = "ARIA — a job-search agent. Workspace root; all code lives in the member packages."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aria-core",
    "aria-llm-gateway",
    "aria-document-parser",
    "aria-api",
    "aria-cli",
]

[tool.uv]
package = false
# The 14-day rule (DECISIONS 2026-10-12), per package until every pin that predates it
# is old enough (2026-10-22); then one global `exclude-newer = "14 days"` replaces this.
# A package added before then gets an entry here so the resolver honours the rule too;
# infra/checks/dependency_age.py is the gate either way.
exclude-newer-package = { pdfplumber = "14 days", pillow = "14 days", pypdfium2 = "14 days", jinja2 = "14 days", playwright = "14 days", pyee = "14 days", onnxruntime = "14 days", tokenizers = "14 days", huggingface-hub = "14 days", hf-xet = "14 days", numpy = "14 days", protobuf = "14 days", flatbuffers = "14 days", fsspec = "14 days", tqdm = "14 days", anthropic = "14 days", httpx2 = "14 days", httpcore2 = "14 days", jiter = "14 days", docstring-parser = "14 days", truststore = "14 days" }
# Packages with native source distributions: a missing wheel fails the install instead of
# compiling Rust or C from source (docs/vetting/2026-10-18-ml-group.md, 2026-10-20-anthropic-sdk.md).
no-build-package = ["tokenizers", "hf-xet", "numpy", "protobuf", "jiter"]

[tool.uv.workspace]
members = [
    "packages/core",
    "services/llm_gateway",
    "services/document_parser",
    "apps/api",
    "apps/cli",
    "engines/resume",
]

[tool.uv.sources]
aria-core = { workspace = true }
aria-llm-gateway = { workspace = true }
aria-document-parser = { workspace = true }
aria-api = { workspace = true }
aria-cli = { workspace = true }
aria-resume = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    # Runs a FastAPI app's lifespan under httpx's ASGI transport, so the start-up
    # checks (token, scanner, engine) are exercised by the tests rather than skipped.
    # Maintained by the florimondmanca/encode circle, pure Python, no install scripts.
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "httpx>=0.27",
    "types-pyyaml>=6.0",
    "types-defusedxml>=0.7.0.20260504",
]
# Local models for the Resume Engine (docs/vetting/2026-10-18-ml-group.md): ONNX Runtime and
# the tokenizers library, no torch. Optional: `uv sync --group ml`; CI never installs it and
# the tests use fakes. Weights come only from `./tasks.ps1 models`, pinned by commit and
# SHA-256 in engines/resume/aria_resume/models.lock; nothing downloads at runtime.
ml = [
    # Microsoft, MIT, wheels only (no sdist on PyPI). 1.30.0 of 2026-09-10.
    "onnxruntime>=1.30.0,<1.31",
    # Hugging Face, Apache-2.0, abi3 wheels. Loaded from a local tokenizer.json only.
    "tokenizers>=0.23.2,<0.24",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = [
    "packages/core",
    "services/llm_gateway",
    "services/document_parser",
    "apps/api",
    "apps/cli",
]
# Ruff formats Python code blocks inside Markdown. The specs in docs/ are the source of
# truth and are written by hand; the formatter must not touch them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # import order
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # bandit: security
    "DTZ",           # naive datetimes: every ARIA timestamp is timezone-aware
    "ASYNC",
    "RUF",
]
ignore = [
    "S101",  # assert: used throughout the tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]
# Migration bodies are generated by `alembic revision --autogenerate` and then
# reviewed by hand. Reflowing the generated create_table calls would mean rewriting
# them on every regeneration, which makes the diff harder to review, not easier.
"infra/migrations/versions/*.py" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core:services/llm_gateway:services/document_parser:apps/api:apps/cli:engines/resume"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_decorators = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = [
    "packages/core/tests",
    "services/llm_gateway/tests",
    "services/document_parser/tests",
    "apps/api/tests",
    "apps/cli/tests",
    "engines/resume/tests",
    "evals/tests",
]
asyncio_mode = "auto"
# importlib import mode: each workspace member has its own tests directory, and the
# default prepend mode would import the first "tests" package it finds and then fail
# to see the others. No __init__.py in the test directories, for the same reason.
addopts = "-q --strict-markers --import-mode=importlib"
consider_namespace_packages = true
markers = [
    "db: needs the local Postgres from infra/docker-compose.yml",
    "docker: needs Docker and the parser image (./tasks.ps1 parser-image)",
    "chromium: needs Playwright's Chromium (uv run playwright install chromium); CI installs it rather than skipping",
    "live: calls a real, paid model provider; skipped unless ARIA_LIVE_LLM=1 and ARIA_ANTHROPIC_API_KEY are set",
    "models: needs the local model weights (./tasks.ps1 models) and the ml group; skipped where absent, and CI never downloads them",
]
