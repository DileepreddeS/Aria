[project]
name = "aria"
version = "0.0.0"
description = "ARIA — a job-search agent. Workspace root; all code lives in the member packages."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aria-core",
    "aria-llm-gateway",
    "aria-api",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "services/llm_gateway", "apps/api"]

[tool.uv.sources]
aria-core = { workspace = true }
aria-llm-gateway = { workspace = true }
aria-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "httpx>=0.27",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages/core", "services/llm_gateway", "apps/api"]
# Ruff formats Python code blocks inside Markdown. The specs in docs/ are the source of
# truth and are written by hand; the formatter must not touch them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # import order
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # bandit: security
    "DTZ",           # naive datetimes: every ARIA timestamp is timezone-aware
    "ASYNC",
    "RUF",
]
ignore = [
    "S101",  # assert: used throughout the tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/core:services/llm_gateway:apps/api"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "*.tests.*"]
disallow_untyped_decorators = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "services/llm_gateway/tests", "apps/api/tests"]
asyncio_mode = "auto"
# importlib import mode: each workspace member has its own tests directory, and the
# default prepend mode would import the first "tests" package it finds and then fail
# to see the others. No __init__.py in the test directories, for the same reason.
addopts = "-q --strict-markers --import-mode=importlib"
consider_namespace_packages = true
markers = [
    "db: needs the local Postgres from infra/docker-compose.yml",
]
