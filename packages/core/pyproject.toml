[project]
name = "aria-core"
version = "0.0.0"
description = "ARIA core: typed message schemas, data classification, state machines, policy engine, audit log, crypto, database access."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "cryptography>=44.0",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aria_core"]
