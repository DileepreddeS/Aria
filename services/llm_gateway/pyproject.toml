[project]
name = "aria-llm-gateway"
version = "0.0.0"
description = "The only ARIA component permitted to talk to LLM providers. Enforces data-class rules, untrusted-content separation and cost accounting."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aria-core",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    # The one model provider (DECISIONS 2026-10-16), vetted at this version in
    # docs/vetting/2026-10-20-anthropic-sdk.md. Only this service may depend on it.
    "anthropic>=1.11.0,<1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aria_llm_gateway"]
