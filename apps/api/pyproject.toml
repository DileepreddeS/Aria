[project]
name = "aria-api"
version = "0.0.0"
description = "ARIA cloud API (modular monolith): users, preferences, jobs, applications, liaison, dashboard API."
requires-python = ">=3.12,<3.13"
dependencies = [
    "aria-core",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aria_api"]
