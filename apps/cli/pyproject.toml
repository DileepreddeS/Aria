[project]
name = "aria-cli"
version = "0.1.0"
description = "ARIA's command line: a thin HTTP client over the API."
requires-python = ">=3.12"
dependencies = [
    "aria-core",
    "httpx>=0.27",
]

[project.scripts]
# So `uv run aria questions` works, which is how it will actually be used.
aria = "aria_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aria_cli"]
