# Hooks run on every commit. gitleaks is installed on the machine (winget install gitleaks)
# and invoked as a system binary, so it is the same scanner CI uses.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-control-characters
        name: no stray control characters
        entry: uv run python infra/checks/no_control_characters.py
        language: system
        types: [text]

      # A changed lock is a changed dependency: refuse files younger than 14 days
      # unless they fix a CVE (DECISIONS 2026-10-12).
      # A real person's name, email, phone or handle in a staged file. The denylist
      # lives in private/pii-denylist.txt, never in the repository.
      - id: no-personal-identifiers
        name: no real personal identifiers
        entry: uv run python infra/checks/no_personal_identifiers.py
        language: system
        types: [text]

      - id: dependency-age
        name: dependency versions at least 14 days old
        entry: uv run python infra/checks/dependency_age.py
        language: system
        files: ^uv\.lock$
        pass_filenames: false

      - id: gitleaks-system
        name: gitleaks (system binary)
        entry: gitleaks
        args: ["git", "--pre-commit", "--staged", "--redact", "--verbose"]
        language: system
        pass_filenames: false

      - id: mypy-core
        name: mypy (strict)
        entry: bash -c "uv run mypy packages/core && uv run mypy services/llm_gateway && uv run mypy apps/api"
        language: system
        types: [python]
        pass_filenames: false
