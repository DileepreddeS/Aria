# Hooks run on every commit, once `uv run pre-commit install` has been run (./tasks.ps1 setup
# does it). gitleaks runs from the release CI installs, in its pinned image
# (infra/checks/gitleaks.py), so it is the same scanner CI uses and needs only Docker.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: local
    hooks:
      # The lock's ruff, the one `make lint` and CI run: a hook pinned on its own drifted to
      # 0.8.6 against the lock's 0.16.10 and failed what CI passes (DECISIONS 2026-11-08).
      # --force-exclude applies extend-exclude to files named one by one, as `ruff check .` does.
      - id: ruff
        name: ruff (the lock's version)
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format (the lock's version)
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: no-control-characters
        name: no stray control characters
        entry: uv run python infra/checks/no_control_characters.py
        language: system
        types: [text]

      # A real person's name, email, phone or handle in a staged file. The denylist
      # lives in private/pii-denylist.txt, never in the repository.
      - id: no-personal-identifiers
        name: no real personal identifiers
        entry: uv run python infra/checks/no_personal_identifiers.py
        language: system
        types: [text]

      # A changed lock is a changed dependency: refuse files younger than 14 days unless
      # each is a declared security fix (DECISIONS 2026-10-12, 2026-10-22). The exemptions
      # and exact pins live in pyproject.toml, so a change there is checked too.
      - id: dependency-age
        name: dependency versions at least 14 days old
        entry: uv run python infra/checks/dependency_age.py
        language: system
        files: ^(uv\.lock|pyproject\.toml|infra/checks/dependency_age\.py)$
        pass_filenames: false

      - id: gitleaks
        name: gitleaks (staged changes, CI's pinned release)
        entry: uv run python infra/checks/gitleaks.py staged
        language: system
        pass_filenames: false

      # Every member `make typecheck` checks, on an export of the index alone: run on the work
      # tree, mypy saw untracked files beside the staged ones (DECISIONS 2026-11-09).
      - id: mypy
        name: mypy (strict, what is being committed)
        entry: uv run python infra/checks/mypy_staged.py
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
