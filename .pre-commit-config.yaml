# Hooks run on every commit. gitleaks is installed on the machine (winget install gitleaks)
# and invoked as a system binary, so it is the same scanner CI uses.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: gitleaks-system
        name: gitleaks (system binary)
        entry: gitleaks
        args: ["git", "--pre-commit", "--staged", "--redact", "--verbose"]
        language: system
        pass_filenames: false

      - id: mypy-core
        name: mypy (strict)
        entry: bash -c "uv run mypy packages/core && uv run mypy services/llm_gateway && uv run mypy apps/api"
        language: system
        types: [python]
        pass_filenames: false
