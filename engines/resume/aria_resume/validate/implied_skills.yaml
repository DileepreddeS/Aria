# Implied skills the skills line may list (RESUME_ENGINE §9 6b), reviewed as one list.
#
# A fact backs the skills it names. The taxonomy's implications are wider, because they
# serve matching: RAG implies LLMs, and LLMs, through one more step, statistics. Listing
# those would turn an inference about the candidate into a claim. A pair belongs here
# only when the implication is a fact about the technology itself: Next.js is React,
# PostgreSQL speaks SQL, Kubernetes runs containers. One step only, and each pair must be
# a direct `implies` edge in the taxonomy (checked when loaded).
#
# Where it applies: the skills line only. Never a bullet and never the summary, where an
# implied skill would read as a claim about what was built rather than what is known.
#
# Versioned: the version travels into each resume's artifacts. Change a pair, change it.
version: "2026.10.1"

