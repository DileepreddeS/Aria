[project]
name = "aria-resume"
version = "0.1.0"
description = "ARIA Resume Engine: one job description and one candidate snapshot in, a truth-validated one-page resume out."
requires-python = ">=3.12,<3.13"
# Pure: it imports aria_core's schemas and taxonomy, never its database code, never an
# app, never a model provider (tests/test_boundaries.py). Its model calls go through an
# LlmClient the caller supplies, which in production is the gateway.
dependencies = [
    "aria-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aria_resume"]
