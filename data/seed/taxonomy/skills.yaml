# ARIA skill taxonomy — public, non-personal seed data (S0).
#
# Shape per entry:
#   id:       canonical id, lowercase, stable forever (it is stored on facts)
#   display:  how ARIA spells it when a job description does not provide a spelling
#   category: language | frontend | backend | data | ml | infra | tooling | practice | domain
#   aliases:  surface forms seen in the wild. Case, punctuation and separators are
#             normalised, so "Next.js", "next js" and "NextJS" all match one alias.
#   implies:  canonical ids this skill is evidence *for*, when matching a requirement.
#             Never used to add years or to put a skill on a resume (see
#             aria_core.graph.derive): an implication informs matching, never a claim.
#
# Scope: the founder's stack, plus the skills that recur in new-grad JDs he does not
# have, so a gap report names a canonical skill instead of an unknown term. It grows
# as the crawler meets real postings.
#
# Bump `version` on every change: it is recorded in each resume's artifacts, so a
# resume can be explained with the taxonomy that produced it.
version: "2026.10.2"

